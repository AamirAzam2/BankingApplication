services:

  mysql:
    image: mysql:8.0
    container_name: banking-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: banking_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    volumes:
      - banking_mysql_data:/var/lib/mysql
    restart: always

volumes:
  banking_mysql_data:
